<?php
function generateKey($length = 16) {
    $chars = 'IkyWXYZ0123456789';
    $key = 'IKYCRACKER-';
    for ($i = 0; $i < $length; $i++) {
        $key .= $chars[rand(0, strlen($chars) - 1)];
    }
    return $key;
}

$key = "";
$expired = "";

if (isset($_POST['create'])) {
    $days = intval($_POST['days']);
    if ($days <= 0) $days = 1;

    $key = generateKey();
    $expired = date("d-m-Y H:i:s", strtotime("+$days days"));
}
